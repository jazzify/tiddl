[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiddl"
version = "3.4.4"
description = "Download Tidal tracks with CLI downloader."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "oskvr37" }, { name = "jazzify" }]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.5",
    "defusedxml>=0.7.1",
    "m3u8>=6.0.0",
    "mutagen>=1.48.1",
    "pydantic>=2.14.4",
    "requests>=2.34.2",
    "requests-cache>=1.3.3",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.17.3",
    "import-linter>=2.17",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]

[project.urls]
homepage = "https://github.com/jazzify/tiddl"

[project.scripts]
tiddl = "tiddl.cli.app:app"

[tool.coverage.run]
omit = ["*/models/*", "*/models.py"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true

[tool.importlinter]
root_package = "tiddl"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: each layer only imports from the ones below it"
type = "layers"
layers = [
    "tiddl.cli",
    "tiddl.core.download",
    "tiddl.core.api | tiddl.core.auth | tiddl.core.metadata | tiddl.core.utils | tiddl.core.protocols",
    "tiddl.core.models",
    "tiddl.core.constants",
    "tiddl.core.types | tiddl.core.exceptions",
]

[[tool.importlinter.contracts]]
name = "core never depends on the CLI or its libraries"
type = "forbidden"
source_modules = ["tiddl.core"]
forbidden_modules = ["tiddl.cli", "typer", "rich"]
