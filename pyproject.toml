[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiddl"
version = "3.4.4"
description = "Download Tidal tracks with CLI downloader."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "oskvr37" }, { name = "jazzify" }]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.2",
    "defusedxml>=0.7.1",
    "m3u8>=6.0.0",
    "mutagen>=1.47.0",
    "pydantic>=2.12.4",
    "requests>=2.32.5",
    "requests-cache>=1.2.1",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.17.3",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]

[project.urls]
homepage = "https://github.com/jazzify/tiddl"

[project.scripts]
tiddl = "tiddl.cli.app:app"

[tool.coverage.run]
omit = ["*/models/*", "*/models.py"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
